name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run structural and unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m unittest discover
          -s repair-ppt-chart-data-links/scripts/tests
          -p "test_*.py"
          -v

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -LiteralPath repair-ppt-chart-data-links -Recurse -Filter '*.ps1' |
            ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$parseErrors
              ) | Out-Null
              $errors += @($parseErrors)
            }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
